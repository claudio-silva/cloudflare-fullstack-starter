name = "cloudflare-fullstack-starter"
main = "./src/worker/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "local"
AUTH_EMAILS_LOCAL_ENABLED = "false"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@example.com"]
remote = true

# Durable Objects: declare ONLY at top level. The Vite plugin builds a flat
# wrangler.json from the top level, so these apply to every environment.
# See docs/VITE_CLOUDFLARE_BRIDGE.md.
[[durable_objects.bindings]]
name = "EXAMPLE_COUNTER"
class_name = "ExampleCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExampleCounter"]

[[d1_databases]]
binding = "DB"
database_name = "cloudflare-fullstack-starter"
database_id = "local"

[env.preview]
[env.preview.vars]
ENVIRONMENT = "preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "cloudflare-fullstack-starter-preview"
database_id = "YOUR_PREVIEW_D1_DATABASE_ID"

[[env.preview.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@example.com"]

[env.production]
[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cloudflare-fullstack-starter"
database_id = "YOUR_PRODUCTION_D1_DATABASE_ID"

[[env.production.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@example.com"]
